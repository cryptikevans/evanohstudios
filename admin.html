<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selekta Evanoh Admin</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="nav"><a class="brand" href="index.html">▮▮▮ EVANOH STUDIOS ADMIN</a><a href="index.html">Public site</a></div></header><main style="padding-top:120px"><div class="wrap"><div id="login"><small>PRIVATE AREA</small><h1>Admin Login</h1><form id="loginForm" class="form"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="btn full">Login</button></form><p id="loginMsg"></p></div><div id="dash" hidden><div style="display:flex;justify-content:space-between;align-items:center"><div><small>CONTROL ROOM</small><h1>Dashboard</h1></div><button id="logout" class="btn ghost">Log out</button></div><div class="form"><section><h2>Upload Mix</h2><form id="mixForm" class="form"><label>Mix title<input id="mt" required></label><label>Description<input id="md"></label><label>Audio<input id="mf" type="file" accept="audio/*" required></label><label>Cover<input id="mc" type="file" accept="image/*"></label><button class="btn full">Publish Mix</button></form><p id="mixMsg"></p></section><section><h2>Upload Event</h2><form id="eventForm" class="form"><label>Name<input id="en" required></label><label>Type<select id="et"><option>Club Event</option><option>Wedding</option><option>Private Party</option><option>Corporate Event</option><option>Festival</option><option>Other</option></select></label><label>Date<input id="ed" type="date" required></label><label>Venue<input id="ev" required></label><label>Ticket price<input id="ep" type="number" min="0" required></label><label class="full">About the event<textarea id="ex" required></textarea></label><label>Poster<input id="ef" type="file" accept="image/*" required></label><button class="btn full">Publish Event</button></form><p id="eventMsg"></p></section></div><section><h2>Published Content</h2><div id="list"></div></section></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
